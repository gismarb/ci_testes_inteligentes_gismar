<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Escola IF - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-container">
    <section class="card login-card">
      <h1>Sistema Escola IF</h1>
      <p class="subtitle">Acesso ao ambiente acadêmico</p>

      <div class="test-data">
        <strong>Dados de teste:</strong>
        <span>E-mail: admin@if.edu.br</span>
        <span>Senha: 123456</span>
      </div>

      <form id="loginForm">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail">

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="Digite sua senha">

        <button type="submit">Entrar</button>
      </form>

      <p id="loginMessage" class="message"></p>

      <p class="small-text">
        Ainda não possui cadastro?
        <a href="cadastro.html">Criar cadastro</a>
      </p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
