<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Escola IF - Cadastro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Sistema Escola IF</h1>
    <nav>
      <a href="login.html">Login</a>
      <a href="cadastro.html">Cadastro</a>
    </nav>
  </header>

  <main class="content">
    <section class="card">
      <h2>Cadastro de estudante</h2>
      <p>Preencha os dados abaixo para simular um cadastro no sistema.</p>

      <form id="cadastroForm">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome">

        <label for="emailCadastro">E-mail</label>
        <input type="email" id="emailCadastro" name="emailCadastro" placeholder="Digite seu e-mail">

        <label for="curso">Curso</label>
        <select id="curso" name="curso">
          <option value="">Selecione um curso</option>
          <option value="Sistemas de Informação">Sistemas de Informação</option>
          <option value="Engenharia de Software">Engenharia de Software</option>
          <option value="Banco de Dados">Banco de Dados</option>
        </select>

        <button type="submit">Cadastrar</button>
      </form>

      <p id="cadastroMessage" class="message"></p>

      <p class="small-text">
        <a href="login.html">Voltar para o login</a>
      </p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
