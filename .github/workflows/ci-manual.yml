name: CI - Testes Manuais

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  testes-manuais:
    name: Executar testes manuais
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js com cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências do projeto
        run: npm install

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar testes manuais
        shell: bash
        run: |
          mkdir -p logs
          set -o pipefail
          echo "Iniciando execução dos testes manuais..."
          npm run test:manual 2>&1 | tee logs/testes-manuais.log
          echo "PASSED - Testes manuais executados com sucesso."

      - name: Registrar falha dos testes manuais
        if: failure()
        run: |
          mkdir -p logs
          echo "FAILED - A pipeline de testes manuais falhou." | tee -a logs/testes-manuais.log

      - name: Publicar relatório HTML do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-html-testes-manuais
          path: playwright-report/
          retention-days: 7

      - name: Publicar artefatos de execução dos testes manuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artefatos-testes-manuais
          path: |
            test-results/
            logs/
          retention-days: 7
